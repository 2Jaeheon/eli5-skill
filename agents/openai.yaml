interface:
  display_name: "ELI5"
  short_description: "Simple Korean explanations with precise technical terms"
  default_prompt: "$eli5 Explain this accurately in Korean simple enough for a five-year-old, adapt the depth to my knowledge, introduce difficult technical terms as English(한국어) with a simple definition, and show actual flow and step-by-step changes with useful diagrams while keeping a moderate length without repetition or rhetorical ornament."
